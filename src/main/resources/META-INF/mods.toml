description='''
在铁砧与全新的「绿宝石强化台」上，使用绿宝石为任何工具、武器、弓弩和盔甲进行强化。
铁砧中放入「工具 + 绿宝石」即可逐级强化，升级前会在结果物品上清楚展示属性变化；
绿宝石强化台则借鉴附魔台机制：放入物品与绿宝石后可三选一，走不同的专精强化方向。
'''

