plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = "${mod_version}"
group = "${mod_group}"
base { archivesName = "${mod_id}-mc1.21.1" }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    // ForgeGradle 6 要求显式声明 minecraft 依赖（Forge 用户开发依赖）
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.19'
    // Forge 1.21.1 生产环境使用的就是 Mojang 官方映射名（与开发环境一致），
    // 因此 Mixin 目标无需 refmap 重映射，也无需 Mixin 注解处理器。
    // ForgeGradle 6 已移除 FG3 时代的 mixin {} 扩展块。
}

// Forge 1.20.6+ / ForgeGradle 6：jar 清单必须显式声明 MixinConfigs，
// 否则 Mixin 配置在生产环境中不会被注册（开发环境不受影响）。
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : 'WorkBuddy',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor' : 'WorkBuddy',
            'MixinConfigs'          : "${mod_id}.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
